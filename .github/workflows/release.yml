name: Release CI
on:
  push:
    branches:
      - main

# Checks every push to main: lint, types, tests and that the theme still builds.
# Redux is published by committing the built javascript/ folder, so there is no
# npm release step (the upstream semantic-release step needed a GH_TOKEN secret
# and an npm package this fork does not have).
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun i

      - name: Lint and type-check
        run: bun run ci

      - name: Test
        run: bun run test --run

      - name: Build
        run: bun run build
